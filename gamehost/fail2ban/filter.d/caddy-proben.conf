# Scanner-Proben im Caddy-Zugriffslog (JSON, eine Zeile je Anfrage).
# Muster wie @proben in gamehost/caddy/Caddyfile, wer eines aendert, aendert beide.
# Hier Python-Regex, darum stehen die Ausnahmen (/.well-known/, /packs/) als
# Lookahead statt als `not path`.
#
# Probe:  fail2ban-regex /var/log/caddy/games.saganta.de.log /etc/fail2ban/filter.d/caddy-proben.conf

[Definition]
_probe = (?i:/\.|[^"?]*/\.(?:env|git|svn|hg|aws|ssh|docker)|[^"?]*\.(?:php\d?|phtml|asp|aspx|jsp|cgi|sql|bak|old|orig|save|swp|ini|cnf|env|axd|7z|rar|tar|gz|tgz|bz2|zip)(?:[?"])|/(?:wp-|wordpress|phpmyadmin|pma|actuator|telescope|server-status|cgi-bin|vendor/|_vti_|elmah))

failregex = "client_ip":"<HOST>",.*?"uri":"(?!/(?:\.well-known|packs)/)%(_probe)s

datepattern = "ts":{EPOCH}
