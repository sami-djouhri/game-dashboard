# LAUFZEIT-REZEPT gamehost (192.0.2.10), hier laeuft die Clan-Seite wirklich.
#
# Diese Datei wird beim Ausrollen nach /opt/game-dashboard/docker-compose.yml gelegt,
# also NEBEN Dockerfile und app/ (Build-Kontext "." ist die Projektwurzel dort, nicht
# dieser Unterordner). Der Ordner hier existiert nur, damit der Live-Stand versioniert
# ist, vor 2026-08-23 war er es nicht: er kam per rsync von host und wurde vor Ort
# von Hand angepasst, ohne dass eine der Aenderungen je in einem Repo landete.
#
# Weicht bewusst vom host-Rezept (../docker-compose.yml) ab:
#  * keine cc-Netzsegmentierung: die cc-core/cc-apps-Zonen gibt es nur auf host.
#  * Welten-Ordner liegt hier unter /opt statt /home/user/docker.
#  * GAME_BRIDGE_URL zeigt auf den eigenen Wirt: die wake-bridge auf .18 ist LAN-only
#    und vom VPS aus bewusst NICHT erreichbar. Steuerbar wird erst, was hier laeuft.
#  * Oeffentlicher Zugang laeuft ueber host-natives Caddy (TLS) statt tardis/cloudflared.
services:
  game-dashboard:
    build: .
    image: homelab/game-dashboard:latest
    container_name: game-dashboard
    restart: unless-stopped
    # Eigene uid statt der 1000 aus dem Image (2026-10-04). Auf diesem Wirt ist uid 1000
    # der Spielnutzer `valheim`, und ein Container-Prozess mit derselben uid ist fuer ihn
    # kein fremder Prozess: er konnte /proc/<pid>/environ lesen (GAME_BRIDGE_TOKEN,
    # OWNER_PASSWORD, PROVISION_TOKEN) und ueber /proc/<pid>/root die SQLite mit Konten und
    # Rollen erreichen. Ein uebernommener oeffentlicher Valheim-Prozess haette damit die
    # Clan-Seite und alle Spiele gesteuert. 10144 = Port der Seite, auf dem Wirt unbelegt.
    # Das Datenvolume muss diesem Besitzer gehoeren (deploy.sh zieht es nach).
    user: "10144:10144"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Nur Loopback; nach aussen geht ausschliesslich Caddy (games.saganta.de, Auto-TLS).
    # Die App macht ihre Auth selbst (eigenes Login).
    ports:
      - "127.0.0.1:8144:8000"
    environment:
      SERVICE_NAME: game-dashboard
      ENV: prod
      LOG_LEVEL: INFO
      BRAND_NAME: "Greenleaf"
      PUBLIC_BASE_URL: "https://games.saganta.de"
      # Cookie nur ueber HTTPS senden (Caddy terminiert TLS). Fuer reine http-Tests
      # via GD_COOKIE_SECURE=false ueberschreibbar, auf einer oeffentlichen Seite nie.
      COOKIE_SECURE: "${GD_COOKIE_SECURE:-true}"
      # Owner-Bootstrap (leerer DB): kommt aus .env (nie committen). Ist owner_password
      # leer, erzeugt der Start ein Zufallspasswort -> data/OWNER_CREDENTIALS.txt.
      OWNER_USER: "${GD_OWNER_USER:-}"
      OWNER_PASSWORD: "${GD_OWNER_PASSWORD:-}"
      DEVELOPER_NAME: "${GD_DEVELOPER_NAME:-}"
      COMMUNITY_DISCORD_URL: "${GD_DISCORD_URL:-}"
      # Bewerbungs-Push in den Herb-#admin-Kanal (Discord-Webhook, aus .env).
      ADMIN_WEBHOOK_URL: "${GD_ADMIN_WEBHOOK_URL:-}"
      # DSGVO: entschiedene Bewerbungen automatisch loeschen (Tage).
      APPLICATION_RETENTION_DAYS: "${GD_APPLICATION_RETENTION_DAYS:-30}"
      # Impressum: volle Postanschrift optional aus .env (nie committen).
      IMPRINT_ADDRESS: "${GD_IMPRINT_ADDRESS:-}"
      IMPRINT_LOCATION: "${GD_IMPRINT_LOCATION:-}"
      # wake-bridge: laeuft hier host-nativ neben dem Dashboard. 127.0.0.1 waere das
      # Loopback des CONTAINERS, nicht das des Wirts -- deshalb host.docker.internal
      # (siehe extra_hosts). Token aus .env (nie committen).
      GAME_BRIDGE_URL: "${GAME_BRIDGE_URL:-http://host.docker.internal:8129}"
      GAME_BRIDGE_TOKEN: "${GAME_BRIDGE_TOKEN}"
      # Passend zum Mount oben, ausserhalb des Volumes.
      MODS_FILE: "/app/mods/mods.json"
      # Ausdruecklich gesetzt, obwohl das Modul denselben Pfad als Vorgabe hat:
      # so steht die Kopplung zwischen Mount und Code an EINER sichtbaren Stelle.
      # Eine stille Vorgabe im Python-Code und ein Mount hier, die nur zufaellig
      # zusammenpassen, sind zwei Wahrheiten ueber denselben Pfad.
      MC_HELFER_DIR: "/app/mc-helfer"
      # Die gerenderte BlueMap-Karte, aus demselben Grund hier sichtbar wie oben.
      MC_KARTE_DIR: "/app/karte"
      # Gaming-Rollen-Automatik: der Greenleaf-Bot gleicht ueber /api/gaming/* ab,
      # wer die Rolle traegt. Erreichbar nur ueber den SSH-Tunnel von node1, nie
      # oeffentlich. Leer = Automatik aus (Endpunkt antwortet 503). Aus .env.
      PROVISION_TOKEN: "${GD_PROVISION_TOKEN:-}"
    extra_hosts:
      # Der Wirt aus Sicht des Containers -- so erreicht das Dashboard die wake-bridge,
      # ohne dass sie einen Port nach aussen oeffnen muesste.
      - "host.docker.internal:host-gateway"
    volumes:
      - game-dashboard-data:/app/data
      # Welten-Snapshots, read-only im Container. Gefuellt wird der Ordner von
      # welten-schnappschuss.timer auf DIESEM Wirt (taeglich 05:23, packt die
      # laufenden Spielstaende nach /var/backups/game-saves und spiegelt hierher).
      # Nicht mehr vom alten host-Timer: dessen Quelle .18 haelt nur eingefrorene
      # Alt-Welten, seit die Spiele hier host-nativ laufen.
      - /opt/game-dashboard/worlds:/app/data/worlds:ro
      # Die Stand-Dateien der Minecraft-Helfer, read-only. Sie liefern die
      # drei Angaben der Minecraft-Kachel, die nicht aus dem Arbiter kommen:
      # wann die Ressourcenwelt erneuert wurde, welcher Einnahmen-Faktor gilt,
      # wie viele Job-Staende gesichert sind (app/mcfakten.py).
      # Das VERZEICHNIS, nicht die drei Dateien einzeln -- dieselbe Falle wie
      # bei mods.json: die Helfer schreiben mit os.replace, und ein
      # Single-File-Bindmount haengt danach an der alten Inode.
      - /var/lib/mc-helfer:/app/mc-helfer:ro
      # Die gerenderte Minecraft-Karte (BlueMap), read-only. Ausgeliefert wird sie
      # von DIESEM Dienst hinter der Anmeldung und nicht von BlueMaps eigenem
      # Webserver auf 8100 -- der verschwindet mit dem Minecraft-Container, und
      # Minecraft laeuft on-demand. Eine Karte, die nur sichtbar ist, waehrend jemand
      # spielt, beantwortet die Frage nie, fuer die man sie aufruft. Die Kacheln sind
      # statische Dateien und ueberleben den Schlaf; nur ihre Aktualisierung pausiert.
      # ⚠️ Das Verzeichnis existiert erst nach der ersten Renderung. Docker legt einen
      # fehlenden Bind-Pfad als leeren Ordner an, deshalb prueft `karte.vorhanden()`
      # die index.html und nicht den Ordner.
      - /opt/mc/data/bluemap/web:/app/karte:ro
      # Mod-Listen je Spiel, gefuellt von mods-sammeln.timer auf DIESEM Wirt.
      # Das VERZEICHNIS einhaengen, nicht die Datei: ein Single-File-Bindmount
      # haengt an der Inode, und der Sammler schreibt die Datei bei jeder Aenderung
      # neu (os.replace). Die Anzeige fröre sonst genau dann ein, wenn sich die
      # Mods geaendert haben.
      # Und NICHT unter /app/data: dort liegt schon das benannte Volume, und ein
      # Bind darunter wird von ihm ueberdeckt. Gemessen am 2026-09-06: der Mount
      # stand in /proc/self/mountinfo, `ls /app/data/mods` zeigte trotzdem den
      # leeren Ordner aus dem Volume, und die Seite meldete „keine Mods bekannt",
      # waehrend die Datei auf dem Wirt sichtbar danebenlag. (Dass `worlds` unter
      # /app/data funktioniert, ist die Reihenfolge, in der Docker die Mounts
      # anlegt, also Glueck und keine Zusage.)
      - /opt/game-dashboard/mods:/app/mods:ro
      # Alle Sicherungs-Toepfe (taeglich/manuell/vor-einspielen/geloescht + Nachtstand),
      # read-only: Admins duerfen jeden Stand herunterladen (2026-10-04). Ausserhalb von
      # /app/data, aus demselben Grund wie mods oben.
      - /var/backups/game-saves:/app/saves:ro
      # Owner-Token der wake-bridge, nur fuer die Loeschwege. Eigene Datei statt .env,
      # root:10144 0640, angelegt auf dem Wirt, nie im Repo.
      - /opt/game-dashboard/secrets/bridge_owner_token:/run/secrets/bridge_owner_token:ro
    labels:
      homelab.service: "game-dashboard"
      homelab.category: "eigenbau"
      homelab.route: "/game-dashboard/"

networks:
  # Festes Subnetz statt Auto-Vergabe: Docker kann sich sonst ein Netz greifen, das
  # anderswo schon vergeben ist -- im Homelab hat genau das einmal das LAN verdeckt.
  # Ausserdem braucht die ufw-Regel fuer Port 8129 eine Quelle, die morgen noch stimmt.
  default:
    name: game-dashboard_default
    ipam:
      config:
        - subnet: 172.30.10.0/24

volumes:
  game-dashboard-data:
    name: game-dashboard-data
