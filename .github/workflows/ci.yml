name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      # Die Tests brauchen weder wake-bridge noch Spielserver: der Weg nach
      # draussen ist in tests/conftest.py durchgehend gestubbt.
      - name: Run tests
        run: pytest -q
